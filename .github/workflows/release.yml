name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # AMO rejects re-signing an existing version, so the tag must match
      # the version in manifest.json (tag v1.0.1 -> "version": "1.0.1").
      - name: Check tag matches manifest version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $VERSION"
            exit 1
          fi

      - name: Lint
        run: npx --yes web-ext@8 lint

      # Unlisted = signed by Mozilla but not shown publicly on AMO.
      - name: Sign with AMO
        run: >
          npx --yes web-ext@8 sign
          --channel=unlisted
          --api-key="${{ secrets.AMO_JWT_ISSUER }}"
          --api-secret="${{ secrets.AMO_JWT_SECRET }}"
          --artifacts-dir=web-ext-artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" web-ext-artifacts/*.xpi --generate-notes
